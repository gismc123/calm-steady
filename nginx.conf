server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers — also improve Google's trust/ranking signals
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header X-XSS-Protection          "1; mode=block"                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Never cache the service worker or HTML — critical for PWA updates to propagate
    location ~* (sw\.js|index\.html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # robots.txt and sitemap.xml — short cache so crawlers pick up changes quickly
    location ~* (robots\.txt|sitemap\.xml)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Type "text/plain; charset=utf-8";
    }

    # Cache icons aggressively — they rarely change
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Moderate caching for JS, CSS, and locale JSON (SW handles versioning)
    location ~* \.(css|js|json)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
